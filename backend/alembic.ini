[alembic]
script_location = alembic
# de alembic import duoc package `app` khi chay tu thu muc backend (file nay giu ASCII: alembic doc bang ma locale, Windows la cp1252)
prepend_sys_path = .
# URL lay tu bien moi truong trong alembic/env.py
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
