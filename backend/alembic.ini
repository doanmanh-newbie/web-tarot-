[alembic]
script_location = alembic
# để alembic import được package `app` khi chạy từ thư mục backend
prepend_sys_path = .
# URL lấy từ biến môi trường trong alembic/env.py
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
